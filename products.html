<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all Bhumi Foods masala powders and spice blends. Pure, authentic Kerala spices delivered fresh.">
  <title>Products — Bhumi Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'sage-light':'#F1F4E9','sage':'#DDE8D4','forest':'#214A36','cream':'#F4EBDD','beige':'#B7A078'},fontFamily:{heading:['"Playfair Display"','Georgia','serif'],body:['"DM Sans"','system-ui','sans-serif'],ml:['"Noto Sans Malayalam"','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Sans+Malayalam:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
</head>
<body class="bg-sage-light font-body text-gray-800 antialiased">

  <div id="nav-container"></div>

  <!-- Page Header -->
  <div class="bg-forest py-14 md:py-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <span class="block text-beige/70 text-xs font-semibold uppercase tracking-[0.2em] mb-3">Pure Kerala Masalas</span>
      <h1 class="font-heading text-3xl md:text-4xl lg:text-5xl text-white font-normal">All Products</h1>
    </div>
  </div>

  <!-- Filters + Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-16">

    <!-- Category Filter Pills -->
    <div id="category-filters" class="flex flex-wrap gap-2 mb-8" role="group" aria-label="Filter by category">
      <button class="variant-pill selected text-sm py-2 px-4" data-category="">All</button>
      <!-- JS fills remaining category buttons -->
    </div>

    <!-- Products Grid -->
    <div id="products-grid"
      class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-5"
      role="list"
      aria-label="Products">
      <!-- JS renders product cards + pagination -->
      <div class="skeleton col-span-2 sm:col-span-3 lg:col-span-4 xl:col-span-5 h-64 rounded-sm"></div>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="flex justify-center gap-2 mt-10 md:mt-14"></div>

  </main>

  <div id="footer-container"></div>

  <script type="module" src="/js/pages/products.js"></script>
</body>
</html>
