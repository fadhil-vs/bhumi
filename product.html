<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Bhumi Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'sage-light':'#F1F4E9','sage':'#DDE8D4','forest':'#214A36','cream':'#F4EBDD','beige':'#B7A078'},fontFamily:{heading:['"Playfair Display"','Georgia','serif'],body:['"DM Sans"','system-ui','sans-serif'],ml:['"Noto Sans Malayalam"','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Sans+Malayalam:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
</head>
<body class="bg-sage-light font-body text-gray-800 antialiased">

  <div id="nav-container"></div>

  <!-- Breadcrumb -->
  <div class="bg-white border-b border-sage py-3">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex items-center gap-2 text-xs text-gray-500" aria-label="Breadcrumb">
        <a href="/index.html" class="hover:text-forest transition-colors">Home</a>
        <span>›</span>
        <a href="/products.html" class="hover:text-forest transition-colors">Products</a>
        <span>›</span>
        <span id="breadcrumb-name" class="text-forest font-medium">Loading…</span>
      </nav>
    </div>
  </div>

  <!-- Product Detail -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-16">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16" id="product-detail">

      <!-- Gallery (left) -->
      <div id="product-gallery">
        <div class="skeleton aspect-square rounded-sm"></div>
      </div>

      <!-- Info (right) -->
      <div id="product-info" class="flex flex-col">
        <!-- JS renders: name, category, variant picker, qty, add to cart, description -->
        <div class="space-y-4">
          <div class="skeleton h-8 w-3/4 rounded-sm"></div>
          <div class="skeleton h-4 w-1/4 rounded-sm"></div>
          <div class="skeleton h-24 w-full rounded-sm"></div>
          <div class="skeleton h-12 w-full rounded-sm"></div>
        </div>
      </div>
    </div>

    <!-- Related products -->
    <div class="mt-16 md:mt-24">
      <h2 class="font-heading text-2xl md:text-3xl text-forest font-normal mb-8">You May Also Like</h2>
      <div id="related-products" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>
  </main>

  <!-- Add to Cart Toast -->
  <div id="cart-toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-forest text-white text-sm font-medium px-5 py-3 rounded-sm shadow-lg flex items-center gap-2 transition-all duration-300">
    <svg class="w-4 h-4 text-beige" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="cart-toast-msg">Added to cart</span>
  </div>

  <div id="footer-container"></div>
  <script type="module" src="/js/pages/productDetail.js"></script>
</body>
</html>
