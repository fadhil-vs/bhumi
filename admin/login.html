<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../env.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Bhumi Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'sage-light':'#F1F4E9','sage':'#DDE8D4','forest':'#214A36','cream':'#F4EBDD','beige':'#B7A078'},fontFamily:{heading:['"Playfair Display"','Georgia','serif'],body:['"DM Sans"','system-ui','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="bg-sage-light font-body antialiased min-h-screen flex items-center justify-center p-4" style="visibility:hidden">

  <div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <img src="/assets/images/logo.png" alt="Bhumi Foods" class="h-14 w-14 object-contain mx-auto mb-3" onerror="this.style.display='none'">
      <h1 class="font-heading text-2xl text-forest font-normal">BHUMI FOODS</h1>
      <p class="text-xs text-gray-500 mt-1 uppercase tracking-widest">Admin Dashboard</p>
    </div>

    <!-- Login Card -->
    <div class="admin-card">
      <h2 class="font-heading text-lg text-forest font-normal mb-6 text-center">Sign In</h2>

      <form id="login-form" class="space-y-5" novalidate>
        <div>
          <label class="admin-label" for="email">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email"
            class="admin-input" placeholder="admin@bhumifoods.net" required>
          <p class="error-msg text-red-500 text-xs mt-1 hidden" id="email-error"></p>
        </div>

        <div>
          <label class="admin-label" for="password">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password"
              class="admin-input pr-10" placeholder="••••••••" required>
            <button type="button" id="toggle-pw"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-forest transition-colors"
              aria-label="Show password">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <p class="error-msg text-red-500 text-xs mt-1 hidden" id="pw-error"></p>
        </div>

        <!-- Error banner -->
        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-sm"></div>

        <button type="submit" id="login-btn"
          class="btn-forest w-full justify-center rounded-sm text-sm py-3">
          Sign In
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      Bhumi Foods Internal Admin · <a href="/" class="hover:text-forest transition-colors">Visit Site</a>
    </p>
  </div>

  <script type="module" src="/js/admin/login.js"></script>
</body>
</html>
