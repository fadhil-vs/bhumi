<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Bhumi Foods Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'sage-light':'#F1F4E9','sage':'#DDE8D4','forest':'#214A36','cream':'#F4EBDD','beige':'#B7A078'},fontFamily:{heading:['"Playfair Display"','Georgia','serif'],body:['"DM Sans"','system-ui','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="bg-sage-light font-body antialiased">
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar (shared snippet — will be component in M7) -->
  <aside class="w-60 bg-forest flex-shrink-0 hidden md:flex flex-col">
    <div class="px-5 py-6 border-b border-white/10">
      <a href="/admin/dashboard.html" class="flex items-center gap-2.5">
        <img src="/assets/images/logo.png" class="h-8 w-8 object-contain opacity-80" onerror="this.style.display='none'">
        <div><span class="block text-white font-heading text-sm font-semibold tracking-wider">BHUMI FOODS</span><span class="block text-white/40 text-[10px] uppercase tracking-widest">Admin</span></div>
      </a>
    </div>
    <nav class="flex-1 px-3 py-5 space-y-1">
      <a href="/admin/dashboard.html"      class="admin-sidebar-link">Dashboard</a>
      <a href="/admin/products/index.html" class="admin-sidebar-link active" aria-current="page">Products</a>
      <a href="/admin/categories.html"     class="admin-sidebar-link">Categories</a>
      <a href="/admin/homepage.html"       class="admin-sidebar-link">Homepage</a>
      <a href="/admin/videos.html"         class="admin-sidebar-link">Factory Videos</a>
      <a href="/admin/orders.html"         class="admin-sidebar-link">Orders</a>
      <a href="/admin/settings.html"       class="admin-sidebar-link">Settings</a>
    </nav>
    <div class="px-3 py-4 border-t border-white/10">
      <button id="logout-btn" class="admin-sidebar-link w-full text-left text-red-300 hover:text-red-200 hover:bg-red-900/20">Log Out</button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-sage px-6 py-4 flex items-center justify-between flex-shrink-0">
      <h1 class="font-heading text-xl text-forest font-normal">Products</h1>
      <div class="flex items-center gap-3">
        <!-- Search -->
        <input id="search-input" type="search" placeholder="Search products…" class="admin-input w-48 py-2 text-sm">
        <a href="/admin/products/add.html" class="btn-forest rounded-sm text-sm flex items-center gap-2 py-2.5 px-4">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Add Product
        </a>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6">

      <!-- Filter tabs -->
      <div class="flex gap-2 mb-6">
        <button class="variant-pill selected text-sm py-1.5 px-4" data-filter="all">All</button>
        <button class="variant-pill text-sm py-1.5 px-4" data-filter="active">Active</button>
        <button class="variant-pill text-sm py-1.5 px-4" data-filter="inactive">Inactive</button>
        <button class="variant-pill text-sm py-1.5 px-4" data-filter="featured">Featured</button>
      </div>

      <!-- Products table / cards -->
      <div class="admin-card p-0 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-sage-light border-b border-sage">
            <tr>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500 w-10">#</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500">Product</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500 hidden md:table-cell">Category</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500 hidden lg:table-cell">Variants</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500">Status</th>
              <th class="text-right px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500">Actions</th>
            </tr>
          </thead>
          <tbody id="products-table-body">
            <!-- JS fills rows -->
            <tr><td colspan="6" class="px-5 py-10 text-center text-sm text-gray-400">Loading products…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div id="admin-pagination" class="flex justify-center gap-2 mt-6"></div>
    </main>
  </div>
</div>

<!-- Delete confirmation modal -->
<div id="delete-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/40">
  <div class="admin-card max-w-sm w-full">
    <h3 class="font-heading text-lg text-forest font-normal mb-2">Delete Product?</h3>
    <p class="text-sm text-gray-600 mb-6">This action cannot be undone. The product will be permanently removed.</p>
    <div class="flex gap-3">
      <button id="delete-cancel" class="flex-1 py-2.5 text-sm border border-sage rounded-sm hover:bg-sage-light transition-colors">Cancel</button>
      <button id="delete-confirm" class="flex-1 py-2.5 text-sm bg-red-600 text-white rounded-sm hover:bg-red-700 transition-colors font-semibold">Delete</button>
    </div>
  </div>
</div>

<script type="module" src="/js/admin/products-list.js"></script>
</body>
</html>
