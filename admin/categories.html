<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../env.js"></script>

  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Bhumi Foods Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'sage-light':'#F1F4E9','sage':'#DDE8D4','forest':'#214A36','cream':'#F4EBDD','beige':'#B7A078'},fontFamily:{heading:['"Playfair Display"','Georgia','serif'],body:['"DM Sans"','system-ui','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Sans+Malayalam:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="bg-sage-light font-body antialiased" style="visibility:hidden">
<div class="flex h-screen overflow-hidden">
  <aside class="w-60 bg-forest flex-shrink-0 hidden md:flex flex-col">
    <div class="px-5 py-6 border-b border-white/10"><a href="/admin/dashboard.html" class="flex items-center gap-2.5"><img src="/assets/images/logo.png" class="h-8 w-8 object-contain opacity-80" onerror="this.style.display='none'"><div><span class="block text-white font-heading text-sm font-semibold tracking-wider">BHUMI FOODS</span><span class="block text-white/40 text-[10px] uppercase tracking-widest">Admin</span></div></a></div>
    <nav class="flex-1 px-3 py-5 space-y-1">
      <a href="/admin/dashboard.html"      class="admin-sidebar-link">Dashboard</a>
      <a href="/admin/products/index.html" class="admin-sidebar-link">Products</a>
      <a href="/admin/categories.html"     class="admin-sidebar-link active" aria-current="page">Categories</a>
      <a href="/admin/homepage.html"       class="admin-sidebar-link">Homepage</a>
      <a href="/admin/videos.html"         class="admin-sidebar-link">Factory Videos</a>
      <a href="/admin/orders.html"         class="admin-sidebar-link">Orders</a>
      <a href="/admin/settings.html"       class="admin-sidebar-link">Settings</a>
    </nav>
    <div class="px-3 py-4 border-t border-white/10"><button id="logout-btn" class="admin-sidebar-link w-full text-left text-red-300 hover:text-red-200 hover:bg-red-900/20">Log Out</button></div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-sage px-6 py-4 flex items-center justify-between flex-shrink-0">
  <script src="../env.js"></script>

      <h1 class="font-heading text-xl text-forest font-normal">Categories</h1>
      <button id="add-category-btn" class="btn-forest rounded-sm text-sm flex items-center gap-2 py-2.5 px-4">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Add Category
      </button>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <p class="text-sm text-gray-500 mb-6">Drag rows to reorder how categories appear on the site.</p>
      <div class="admin-card p-0 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-sage-light border-b border-sage">
            <tr>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500 w-8">↕</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500">Image</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500">Name (EN)</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500 hidden md:table-cell">Name (ML)</th>
              <th class="text-left px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500">Status</th>
              <th class="text-right px-5 py-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500">Actions</th>
            </tr>
          </thead>
          <tbody id="categories-table-body">
            <tr><td colspan="6" class="px-5 py-10 text-center text-sm text-gray-400">Loading categories…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Category Modal -->
<div id="category-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/40">
  <div class="admin-card max-w-md w-full">
    <h3 class="font-heading text-lg text-forest font-normal mb-5" id="modal-title">Add Category</h3>
    <form id="category-form" class="space-y-4" novalidate>
      <div>
        <label class="admin-label" for="cat-name-en">Name (English) <span class="text-red-500">*</span></label>
        <input id="cat-name-en" name="name_en" type="text" class="admin-input" placeholder="e.g. Chilli Powders" required>
      </div>
      <div>
        <label class="admin-label" for="cat-name-ml">Name (Malayalam)</label>
        <input id="cat-name-ml" name="name_ml" type="text" class="admin-input font-ml" placeholder="ഉദാ. മുളക് പൊടി" lang="ml">
      </div>
      <div>
        <label class="admin-label">Category Image</label>
        <div id="cat-image-drop" class="border-2 border-dashed border-sage rounded-sm p-5 text-center cursor-pointer hover:border-forest/40 transition-colors">
          <p class="text-sm text-gray-500">Drop image or <span class="text-forest underline">browse</span></p>
          <input id="cat-image-input" type="file" accept="image/*" class="hidden">
        </div>
        <div id="cat-image-preview" class="mt-2 hidden"><img id="cat-preview-img" class="h-20 w-20 object-cover rounded-sm border border-sage"></div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" id="modal-cancel" class="flex-1 py-2.5 text-sm border border-sage rounded-sm hover:bg-sage-light transition-colors">Cancel</button>
        <button type="submit" id="modal-save" class="flex-1 btn-forest rounded-sm text-sm py-2.5">Save Category</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="/js/admin/categories-admin.js"></script>
</body>
</html>
