<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script src="./env.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Bhumi Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'sage-light':'#EEF4FA','sage':'#D6E4F2','forest':'#27598A','cream':'#EEF4FA','beige':'#D4930D','forest-dark':'#1B4170','accent':'#FCD34D'},fontFamily:{heading:['"Segoe UI"','"Open Sans"','system-ui','sans-serif'],body:['"Segoe UI"','"Open Sans"','system-ui','sans-serif'],ml:['"Noto Sans Malayalam"','sans-serif']}}}};</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
</head>
<body class="bg-sage-light font-body text-gray-800 antialiased">

  <div id="nav-container"></div>

  <!-- Page Header -->
  <div class="bg-white border-b border-sage py-8 md:py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <span class="block text-beige text-xs font-semibold uppercase tracking-[0.2em] mb-2">Review Order</span>
      <h1 class="font-heading text-3xl md:text-4xl text-forest font-normal">Your Cart</h1>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-14">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 lg:gap-10">

      <!-- Cart Items (left 2 cols) -->
      <div class="lg:col-span-2">
        <div id="cart-items">
          <!-- JS renders cart items or empty state -->
          <div class="bg-white p-8 text-center rounded-sm border border-sage/50">
            <div class="skeleton h-40 w-full rounded-sm"></div>
          </div>
        </div>
      </div>

      <!-- Order Summary & Customer Info (right col) -->
      <div class="lg:col-span-1">
        <div class="bg-white p-6 md:p-8 rounded-sm border border-sage/60 sticky top-24 shadow-sm" id="cart-summary">
          <h2 class="font-heading text-xl text-forest font-normal mb-5">Order Summary</h2>

          <div class="space-y-3 mb-5" id="summary-lines">
            <div class="skeleton h-4 w-full rounded-sm"></div>
            <div class="skeleton h-4 w-3/4 rounded-sm"></div>
          </div>

          <div class="border-t border-sage pt-4 mb-6">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-sm text-gray-700">Total</span>
              <span class="font-heading text-xl text-beige font-semibold" id="cart-total">₹0</span>
            </div>
          </div>

          <!-- ── Customer Information Form ── -->
          <div class="border-t border-sage pt-5 mb-5" id="customer-form-wrap">
            <h3 class="font-heading text-sm text-forest font-semibold uppercase tracking-wider mb-3">Delivery Information</h3>
            <div class="space-y-3">
              <div>
                <label for="cust-name" class="block text-xs font-medium text-gray-600 mb-1">Your Name <span class="text-red-500">*</span></label>
                <input
                  type="text"
                  id="cust-name"
                  placeholder="e.g. Rahul Nair"
                  class="w-full text-xs px-3 py-2 border border-sage rounded-sm focus:outline-none focus:border-forest transition-colors">
              </div>

              <div>
                <label for="cust-phone" class="block text-xs font-medium text-gray-600 mb-1">Phone Number <span class="text-red-500">*</span></label>
                <input
                  type="tel"
                  id="cust-phone"
                  placeholder="e.g. 9876543210"
                  class="w-full text-xs px-3 py-2 border border-sage rounded-sm focus:outline-none focus:border-forest transition-colors">
              </div>

              <div>
                <label for="cust-address" class="block text-xs font-medium text-gray-600 mb-1">Delivery Address <span class="text-red-500">*</span></label>
                <textarea
                  id="cust-address"
                  rows="2"
                  placeholder="House / Flat name, Street, City, Pincode"
                  class="w-full text-xs px-3 py-2 border border-sage rounded-sm focus:outline-none focus:border-forest transition-colors"></textarea>
              </div>

              <p id="checkout-error" class="text-[11px] text-red-600 font-medium hidden"></p>
            </div>
          </div>

          <button
            id="whatsapp-checkout-btn"
            class="btn-forest w-full justify-center rounded-sm text-sm py-3.5 flex items-center gap-2.5 font-medium shadow hover:shadow-md transition-all"
            aria-label="Proceed to WhatsApp checkout">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            Checkout via WhatsApp
          </button>

          <p class="text-xs text-gray-400 text-center mt-3 leading-relaxed">
            WhatsApp will open with your order details pre-filled. Tap <strong>Send</strong> to confirm.
          </p>

          <a href="/products.html" class="block text-center text-xs text-forest/70 hover:text-forest mt-4 font-medium transition-colors">
            ← Continue Shopping
          </a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/js/pages/cart.js"></script>
</body>
</html>
